{id:'e24',d:'TPE',lvl:3,t:'sc',q:'Coagulant dose was increased to improve a hazy effluent, but the effluent got worse. The most likely explanation is:',o:['Charge reversal has re-stabilised the particles','The coagulant has expired','The flocculator is running too slowly','Detention time is too long'],a:0,e:'Overdosing a coagulant can reverse the particle surface charge, re-stabilising the colloids. Back the dose off and re-run a jar test.'},
{id:'e25',d:'TPE',lvl:3,t:'calc',q:'A circular clarifier 22 m in diameter treats 5,000 m³/day. What is the surface overflow rate?',o:['13.2 m³/m²·day','3.3 m³/m²·day','52.6 m³/m²·day','227 m³/m²·day'],a:0,e:'r = 11 m. A = π × 121 = 380.1 m². SOR = 5,000 ÷ 380.1 = 13.2 m³/m²·day.'},
{id:'e26',d:'TPE',lvl:3,t:'calc',q:'A plant treats 8.0 ML/day with influent BOD 220 mg/L and effluent BOD 22 mg/L. What mass of BOD is removed per day?',o:['1,584 kg/day','1,760 kg/day','176 kg/day','198 kg/day'],a:0,e:'BOD removed as concentration = 220 − 22 = 198 mg/L. kg/day = 198 × 8.0 = 1,584 kg/day.'},
{id:'e27',d:'TPE',lvl:3,t:'calc',q:'A settleometer reads 360 mL/L and MLSS is 2,250 mg/L. What is the SVI, and what does it indicate?',o:['160 — bulking sludge','100 — good settling','80 — excellent settling','360 — normal'],a:0,e:'SVI = (360 × 1,000) ÷ 2,250 = 160. Above 150 indicates bulking; investigate DO and filaments.'},
{id:'e28',d:'TPE',lvl:3,t:'calc',q:'Aeration basin volume is 1.8 ML at MLSS 3,200 mg/L. Total solids leaving the system are 480 kg/day. What is the MCRT?',o:['12 days','9 days','15 days','6 days'],a:0,e:'Solids in system = 3,200 × 1.8 = 5,760 kg. MCRT = 5,760 ÷ 480 = 12 days.'},
{id:'e29',d:'TPE',lvl:2,t:'calc',q:'A jar test gives an optimum dose of 28 mg/L. Flow is 3.5 ML/day. How many kg/day of pure chemical is required?',o:['98 kg/day','9.8 kg/day','980 kg/day','8 kg/day'],a:0,e:'kg/day = mg/L × ML/day = 28 × 3.5 = 98 kg/day.'},
{id:'e30',d:'TPE',lvl:2,t:'calc',q:'A contact chamber holds 60 m³ and treats 4,320 m³/day. What is the contact time in minutes?',o:['20 minutes','30 minutes','15 minutes','45 minutes'],a:0,e:'DT = 60 ÷ 4,320 = 0.01389 days × 1,440 min/day = 20 minutes.'},
{id:'e31',d:'TPE',lvl:1,t:'calc',q:'Influent TSS is 250 mg/L and effluent TSS is 25 mg/L. What is the percent removal?',o:['90%','10%','75%','25%'],a:0,e:'(250 − 25) ÷ 250 × 100 = 90%.'},
{id:'e32',d:'TPE',lvl:1,t:'calc',q:'A tank is 10 m long, 5 m wide with water 3 m deep. What is its volume?',o:['150 m³','18 m³','50 m³','1,500 m³'],a:0,e:'Volume of a rectangular tank = Length × Width × Depth = 10 × 5 × 3 = 150 m³. Note 150 m³ is also 150,000 L, since 1 m³ = 1,000 L.'},
{id:'e33',d:'TPE',lvl:1,t:'mc',q:'Backwash water from a filter is normally sent:',o:['Back to the head of the plant','Directly to the receiving water','To the potable water system','To the screenings bin'],a:0,e:'Backwash water carries the solids removed by the filter and must be re-treated, so it returns to the head of the plant.'},
{id:'e34',d:'TPE',lvl:2,t:'sc',q:'A granular activated carbon vessel has stopped improving water quality although flow is unchanged. The most likely cause is:',o:['The carbon has exhausted its adsorption capacity','The carbon has become too wet','The influent temperature dropped 2 °C','The vessel is over-pressurised'],a:0,e:'Carbon has a finite number of adsorption sites. Once they are occupied the carbon is exhausted and must be replaced or regenerated. Also check for channelling or blinding by suspended solids.'},
{id:'e35',d:'TPE',lvl:2,t:'mc',q:'Which sequence is correct for chemical treatment?',o:['pH adjust → coagulant → rapid mix → polymer → slow mix → settle','Polymer → coagulant → settle → rapid mix','Coagulant → settle → polymer → rapid mix','Rapid mix → settle → coagulant → polymer'],a:0,e:'Coagulant always goes before polymer, with rapid mix for coagulation and slow mix for flocculation, then settling.'},

/* ---------------- EQP — Equipment Evaluation, Maintenance & Operation ---------------- */
{id:'e36',d:'EQP',lvl:1,t:'mc',q:'A gate valve should be used for:',o:['Isolation — fully open or fully closed','Precise throttling of flow','Preventing backflow automatically','Relieving excess pressure'],a:0,e:'Gate valves are isolation valves. Throttling with one erodes the seat and destroys the valve.'},
{id:'e37',d:'EQP',lvl:1,t:'mc',q:'A check valve\'s function is to:',o:['Prevent reverse flow','Throttle flow precisely','Isolate a line for maintenance','Measure flow rate'],a:0,e:'Check valves are automatic one-way valves, protecting pumps from backflow and reverse rotation.'},
{id:'e38',d:'EQP',lvl:1,t:'mc',q:'Which pump type delivers a nearly constant flow regardless of discharge head?',o:['Positive displacement','Centrifugal','Vertical turbine','Self-priming centrifugal'],a:0,e:'PD pumps move a fixed volume per cycle. Centrifugal pump flow falls as head rises.'},
{id:'e39',d:'EQP',lvl:1,t:'mc',q:'Priming a centrifugal pump means:',o:['Filling the casing and suction with liquid','Lubricating the bearings','Adjusting the packing gland','Setting the motor overload'],a:0,e:'A centrifugal pump cannot pump air, so it must be filled with liquid to develop suction.'},
{id:'e40',d:'EQP',lvl:1,t:'mc',q:'Fine-bubble diffusers compared with coarse-bubble diffusers:',o:['Transfer oxygen more efficiently','Transfer oxygen less efficiently','Require no maintenance','Cannot be used in activated sludge'],a:0,e:'Smaller bubbles give more surface area per volume of air and rise more slowly, so oxygen transfer efficiency is higher.'},
{id:'e41',d:'EQP',lvl:1,t:'mc',q:'Aeration typically accounts for what share of a treatment plant\'s energy use?',o:['The largest single share','Less than 5%','About 1%','None — aeration is passive'],a:0,e:'Aeration is typically 50–60% of plant electricity, making DO control the biggest energy lever an operator has.'},
{id:'e42',d:'EQP',lvl:2,t:'sc',q:'A pump is making a rattling noise like gravel and the discharge gauge is fluctuating wildly. The operator should investigate:',o:['The suction side for restriction or low level','The discharge check valve only','The motor windings','The effluent weir'],a:0,e:'This describes cavitation, which is caused by insufficient suction pressure — closed valve, plugged strainer, low wet well, or excessive lift.'},
{id:'e43',d:'EQP',lvl:2,t:'mc',q:'Running a positive displacement pump against a closed discharge valve will:',o:['Build pressure until something ruptures','Simply stop the pump safely','Reduce flow gradually to zero with no harm','Improve pump efficiency'],a:0,e:'A PD pump has no internal relief path. A pressure relief valve is mandatory to protect the pump and piping.'},
{id:'e44',d:'EQP',lvl:2,t:'sc',q:'A pump motor\'s amperage has increased 15% over six weeks with no change in process conditions. This suggests:',o:['A developing mechanical problem','Improved efficiency','A flow meter error','Normal seasonal variation'],a:0,e:'Rising amps mean increasing load — a partial clog, bearing wear, misalignment or rubbing. Investigate before failure.'},
{id:'e45',d:'EQP',lvl:3,t:'sc',q:'An operator tightens a pump packing gland until all leakage stops. What is the likely result?',o:['The shaft sleeve overheats and scores from lack of lubrication','The pump becomes measurably more efficient at the same head','Cavitation on the suction side is eliminated entirely','The motor draws noticeably less current under load'],a:0,e:'Packing relies on a slow drip for lubrication and cooling. Running it dry generates heat and scores the shaft sleeve, causing expensive damage. Mechanical seals are the type that should show no leakage.'},
{id:'e46',d:'EQP',lvl:2,t:'sc',q:'Blower discharge pressure is climbing while delivered air flow drops. The FIRST item to check is:',o:['The blower inlet filter','The secondary clarifier weirs','The chlorine residual analyser','The digester heat exchanger'],a:0,e:'Check the cheap, common cause first: a plugged inlet filter starves the blower. Then investigate fouled diffusers downstream.'},
{id:'e47',d:'EQP',lvl:2,t:'sc',q:'A pump runs but delivers no flow. Which is LEAST likely to be the cause?',o:['The effluent weir needs cleaning','The pump has lost its prime','The impeller is clogged','The suction valve is closed'],a:0,e:'A dirty effluent weir does not stop a pump delivering flow. Lost prime, clogged impeller and a closed suction valve all do.'},
{id:'e48',d:'EQP',lvl:2,t:'mc',q:'Water hammer is caused by:',o:['A sudden change in flow velocity, such as rapid valve closure','Excessive dissolved oxygen carried in the pumped liquid','Low pH in the wastewater corroding the pipe interior','Too much lubricant packed into the pump shaft bearing'],a:0,e:'A rapid velocity change creates a pressure surge that can rupture pipe and damage equipment. Slow-closing valves help control it.'},
{id:'e49',d:'EQP',lvl:2,t:'mc',q:'Over-greasing a bearing:',o:['Can blow out the seals and cause failure','Is always beneficial','Has no effect either way','Extends bearing life indefinitely'],a:0,e:'Over-greasing builds pressure that ruptures seals and causes overheating. Follow the manufacturer\'s schedule and quantity.'},
{id:'e50',d:'EQP',lvl:2,t:'mc',q:'A VFD (variable frequency drive) saves energy by:',o:['Varying motor speed to match demand','Increasing the motor voltage','Reducing the number of pumps required','Eliminating the need for maintenance'],a:0,e:'A VFD varies frequency to control motor speed, so a pump or blower delivers only what is needed rather than being throttled.'},
{id:'e51',d:'EQP',lvl:2,t:'mc',q:'A rotating biological contactor typically operates at:',o:['About 40% submerged, about 1.5 rpm','Fully submerged, about 20 rpm','About 90% submerged, about 10 rpm','Above the water, about 5 rpm'],a:0,e:'~40% submergence and ~1.5 rpm lets the biofilm alternately contact wastewater and air.'},
{id:'e52',d:'EQP',lvl:3,t:'sc',q:'An RBC shaft has begun to slow and visibly sag. The most likely cause is:',o:['Excessive biomass accumulation on the first stage','Insufficient influent BOD','Excessive chlorine in the influent','The discs are too thin'],a:0,e:'Heavy first-stage biomass adds enormous weight, overloading bearings and the shaft — a known structural failure mode. Reduce first-stage loading or balance the load.'},
{id:'e53',d:'EQP',lvl:3,t:'sc',q:'A centrifuge has developed noticeable vibration during operation. The correct response is:',o:['Shut it down and inspect before running further','Increase the feed rate to smooth it out','Add more polymer and continue','Ignore it unless it becomes louder'],a:0,e:'Vibration indicates imbalance, worn bearings or scroll wear. Running through vibration risks catastrophic failure. Shut down and inspect.'},
{id:'e54',d:'EQP',lvl:3,t:'sc',q:'A filter bed has developed mudballs and cracks. The underlying cause is most likely:',o:['Backwash rate or duration insufficient to fluidise the bed','Backwash rate far too high','Excessive chlorine in the backwash water','Media that is too fine throughout'],a:0,e:'Inadequate backwash leaves solids behind, which compact into mudballs and cause the bed to crack and channel. Air scour and correct rate/duration fix it.'},
{id:'e55',d:'EQP',lvl:3,t:'mc',q:'Media loss into the backwash trough indicates:',o:['Backwash rate is too high','Backwash rate is too low','The influent turbidity is too low','The filter run time is too short'],a:0,e:'Excessive backwash rate over-expands the bed and carries media out. Too LOW a rate causes mudballs — the opposite problem.'},
{id:'e56',d:'EQP',lvl:3,t:'sc',q:'A UV disinfection system is failing bacteriological limits though lamps are within their rated hours and flow is normal. The most likely cause is:',o:['Fouled quartz sleeves reducing UV delivered to the water','A failed chlorine feed pump','Excessive dechlorination','Insufficient contact chamber baffling'],a:0,e:'Sleeve fouling is the number one cause of UV underperformance. Low UV transmittance from turbidity is the next thing to check.'},
{id:'e57',d:'EQP',lvl:3,t:'calc',q:'A wet well 3 m × 2.5 m drops 1.2 m in 5 minutes with inflow isolated. What is the pump rate in L/min?',o:['1,800 L/min','900 L/min','7,500 L/min','360 L/min'],a:0,e:'Volume = 3 × 2.5 × 1.2 = 9 m³ = 9,000 L. Rate = 9,000 ÷ 5 = 1,800 L/min.'},
{id:'e58',d:'EQP',lvl:3,t:'mc',q:'"Single phasing" on a three-phase motor means:',o:['Loss of one supply phase, causing overheating','The motor is running at half speed by design','Only one winding was installed','The motor is operating at peak efficiency'],a:0,e:'Losing one phase forces the remaining windings to carry excessive current, rapidly overheating and destroying the motor.'},
{id:'e59',d:'EQP',lvl:2,t:'mc',q:'NPSH available must be:',o:['Greater than the NPSH required by the pump','Less than the NPSH required by the pump','Exactly equal to zero','Irrelevant for wastewater pumps'],a:0,e:'If available NPSH falls below what the pump requires, the liquid flashes to vapour at the impeller and the pump cavitates.'},
{id:'e60',d:'EQP',lvl:2,t:'mc',q:'Total Dynamic Head (TDH) includes:',o:['Static lift plus friction losses plus pressure head','Only the vertical lift','Only friction losses','Only the pump discharge pressure rating'],a:0,e:'TDH is everything the pump must work against: static lift, friction through pipe and fittings, and any pressure head at the discharge.'},
{id:'e61',d:'EQP',lvl:1,t:'mc',q:'Preventive maintenance is best described as:',o:['Scheduled work performed to prevent failure','Repairs made after equipment breaks','Replacement of equipment at end of life','Cleaning performed only during inspections'],a:0,e:'PM is scheduled — lubrication, alignment, vibration checks, filter changes — and is far cheaper than corrective maintenance.'},
{id:'e62',d:'EQP',lvl:1,t:'mc',q:'A mechanical seal on a pump should:',o:['Not leak','Drip about once per second','Leak in a steady stream','Be greased weekly'],a:0,e:'Mechanical seals should show no leakage. Packing glands, by contrast, need a slow drip for cooling and lubrication.'},
{id:'e63',d:'EQP',lvl:2,t:'sc',q:'A valve that has not been operated in three years is found seized during an emergency. The best preventive practice is:',o:['Exercise valves on a regular schedule','Replace all valves annually','Leave valves partially open at all times','Remove the valves from the piping'],a:0,e:'Valves that sit in one position seize. Regular exercising as part of the PM programme keeps them functional when needed.'},
{id:'e64',d:'EQP',lvl:2,t:'mc',q:'A globe valve is preferred over a gate valve when you need to:',o:['Throttle and regulate flow','Fully isolate a line','Prevent backflow','Relieve pressure'],a:0,e:'Globe valves are designed to modulate flow. Gate valves are isolation-only and are damaged by throttling.'},
{id:'e65',d:'EQP',lvl:3,t:'sc',q:'A chemical metering pump is set correctly but chemical consumption is far higher than calculated. The LEAST likely cause is:',o:['The wastewater temperature has dropped 2 °C','The pump is out of calibration','There is a leak in the chemical line','The assumed solution strength is wrong'],a:0,e:'A small temperature change does not explain a large consumption discrepancy. Calibration error, leaks and wrong solution strength all do.'},
{id:'e66',d:'EQP',lvl:3,t:'mc',q:'Which is the correct method to verify a chemical metering pump\'s actual output?',o:['Timed drawdown using a calibration column','Reading the dial setting','Checking the motor nameplate','Measuring the discharge pressure'],a:0,e:'A dial setting is not a dose. Only a timed drawdown in a calibration column tells you what the pump actually delivers.'},
{id:'e67',d:'EQP',lvl:2,t:'mc',q:'Grit accumulating in a screen channel indicates:',o:['Approach velocity is too low','Approach velocity is too high','The screen bars are too closely spaced','The screenings bin is full'],a:0,e:'Below about 0.4 m/s, grit drops out in the channel. The design range through a screen is roughly 0.6–1.2 m/s.'},
{id:'e68',d:'EQP',lvl:1,t:'mc',q:'A magnetic flow meter requires:',o:['A full pipe and a conductive liquid','An open channel and clear water','A vacuum in the line','Compressed air injection'],a:0,e:'Mag meters work by electromagnetic induction, so the liquid must conduct and the pipe must run full.'},
{id:'e69',d:'EQP',lvl:2,t:'sc',q:'A Parshall flume has begun reading high. Which is NOT a plausible cause?',o:['The wastewater has become less conductive','The flume is no longer level','Solids have accumulated upstream','The level sensor has drifted'],a:0,e:'Conductivity affects magnetic meters, not flumes. Levelness, upstream solids and sensor drift all affect flume readings.'},
{id:'e70',d:'EQP',lvl:1,t:'mc',q:'The rotating distributor arm on a trickling filter must:',o:['Turn freely and distribute flow evenly','Remain stationary during operation','Rotate at exactly 60 rpm','Be submerged in the media'],a:0,e:'A stopped or uneven distributor quickly kills sections of the biofilm. Check orifices, bearings and seal regularly.'},

/* ---------------- LAB — Laboratory Analysis ---------------- */
{id:'e71',d:'LAB',lvl:1,t:'mc',q:'The BOD₅ test is incubated for:',o:['5 days at 20 °C in the dark','5 hours at 20 °C in the light','5 days at 35 °C in the light','2 hours at 150 °C'],a:0,e:'5 days, 20 °C, in the dark. Darkness prevents algal photosynthesis from adding oxygen and corrupting the result.'},
{id:'e72',d:'LAB',lvl:1,t:'mc',q:'Turbidity is reported in:',o:['NTU','mg/L','mL/L','ppm as CaCO₃'],a:0,e:'Nephelometric Turbidity Units, measured by the scattering of light by suspended particles.'},
{id:'e73',d:'LAB',lvl:1,t:'mc',q:'Settleable solids are reported in:',o:['mL/L','mg/L','NTU','% by mass'],a:0,e:'Measured in an Imhoff cone after one hour and reported as mL/L — a volume, not a mass concentration.'},
{id:'e74',d:'LAB',lvl:1,t:'mc',q:'Which parameter must be measured immediately on a grab sample?',o:['Dissolved oxygen','BOD₅','Total phosphorus','Total suspended solids'],a:0,e:'DO, pH, temperature and chlorine residual all change immediately on removal from the process.'},
{id:'e75',d:'LAB',lvl:1,t:'mc',q:'Total suspended solids samples are dried at:',o:['103–105 °C','550 °C','20 °C','200 °C'],a:0,e:'Dry at 103–105 °C. Ignition at 550 °C determines the volatile (organic) fraction.'},
{id:'e76',d:'LAB',lvl:2,t:'mc',q:'A 24-hour flow-proportional composite sample is preferred for permit BOD because it:',o:['Represents the true daily mass loading','Is faster to collect than a grab','Requires no preservation','Eliminates the need for laboratory QC'],a:0,e:'Weighting portions by flow means the composite reflects actual mass load rather than over-representing low-flow periods.'},
{id:'e77',d:'LAB',lvl:2,t:'sc',q:'A bacteriological sample from a chlorinated effluent returns invalid. The most likely cause is:',o:['No dechlorinating agent was in the bottle','The bottle was too large','The sample was collected at midday','The sample was chilled to 4 °C'],a:0,e:'Without a dechlorinating agent (usually sodium thiosulphate), chlorine keeps killing organisms in the bottle, invalidating the count.'},
{id:'e78',d:'LAB',lvl:2,t:'mc',q:'Volatile suspended solids are determined by:',o:['Igniting the dried filter at 550 °C and measuring weight loss','Filtering the sample and weighing the dried residue only','Titration of the filtered sample with sulphuric acid','Measuring the scattering of light through the sample'],a:0,e:'What burns off at 550 °C is the volatile (organic) portion; the ash remaining is the fixed (inorganic) portion.'},
{id:'e79',d:'LAB',lvl:2,t:'sc',q:'Duplicate TSS results differ by 40%. Which is the LEAST likely cause?',o:['The sample was collected at 08:00 instead of 09:00','The sample was not mixed before pouring','The filters were not dried to constant weight','The balance is out of calibration'],a:0,e:'Collection time does not cause poor duplicate agreement on the same sample. Mixing, drying and balance calibration all do.'},
{id:'e80',d:'LAB',lvl:2,t:'sc',q:'A sample is rejected by the contract laboratory. Which of these would NOT normally be a reason for rejection?',o:['The sample was collected by a Level I rather than a Level II operator','The chain of custody form was incomplete','The hold time had been exceeded','The wrong preservative was used'],a:0,e:'Certification level of the person collecting a routine sample is not a rejection criterion. Incomplete chain of custody, exceeded hold times and wrong preservation all invalidate a sample.'},
{id:'e81',d:'LAB',lvl:2,t:'mc',q:'COD compared to BOD on the same sample will be:',o:['Higher, and available much sooner','Lower, and available much sooner','Identical','Higher, but take 5 days longer'],a:0,e:'COD chemically oxidises material bacteria cannot use, so it is always higher, and it takes about 2 hours versus 5 days.'},
{id:'e82',d:'LAB',lvl:3,t:'sc',q:'A DO probe reads low throughout the plant, including in a sample you know is near saturation. The most likely cause is:',o:['A fouled membrane or depleted electrolyte','Genuinely low oxygen everywhere','Excessive chlorine residual','Water temperature slightly above normal'],a:0,e:'A consistent low bias across all points including a known-good sample points to the instrument, not the process. Service the membrane and electrolyte, then recalibrate.'},
{id:'e83',d:'LAB',lvl:3,t:'sc',q:'BOD results have come back unreasonably low for two weeks while COD is unchanged. The most likely explanation is:',o:['A toxic substance is inhibiting the seed bacteria','The plant is treating far better than before','The COD test is faulty','The samples were over-diluted with distilled water only'],a:0,e:'BOD is a biological test. A toxicant inhibits the seed organisms and suppresses BOD, while COD — a chemical test — is unaffected. That divergence is the clue.'},
{id:'e84',d:'LAB',lvl:3,t:'mc',q:'The classic reference (titration) method for dissolved oxygen is the:',o:['Winkler method','Gravimetric method','Nephelometric method','Breakpoint method'],a:0,e:'The Winkler iodometric titration is the reference method against which DO probes are validated.'},
{id:'e85',d:'LAB',lvl:3,t:'calc',q:'A settleometer reads 300 mL/L and MLSS is 2,000 mg/L. What is the SVI?',o:['150','200','100','66'],a:0,e:'SVI = (300 × 1,000) ÷ 2,000 = 150. This sits right at the bulking threshold — monitor closely.'},
{id:'e86',d:'LAB',lvl:2,t:'calc',q:'Influent BOD is 180 mg/L and effluent BOD is 9 mg/L. What is the percent removal?',o:['95%','90%','5%','171%'],a:0,e:'(180 − 9) ÷ 180 × 100 = 171 ÷ 180 × 100 = 95%.'},
{id:'e87',d:'LAB',lvl:1,t:'mc',q:'Which bottle must never be rinsed with the sample?',o:['A sterile bacteriological bottle','A plastic TSS bottle','A composite carboy','A turbidity vial'],a:0,e:'Rinsing destroys sterility and removes any preservative or dechlorinating agent already present in the bottle.'},
{id:'e88',d:'LAB',lvl:2,t:'mc',q:'Running a known standard alongside your samples is done to:',o:['Verify the accuracy of the method and instrument','Increase the sample volume','Satisfy the chain of custody','Reduce the hold time required'],a:0,e:'Standards verify accuracy; duplicates verify precision. Both are core laboratory quality control.'},

/* ---------------- SSA — Security, Safety & Administrative Procedures ---------------- */
{id:'e89',d:'SSA',lvl:1,t:'mc',q:'Why must oxygen be measured before combustible gas when testing a confined space?',o:['A combustible gas sensor needs oxygen to give a reliable reading','Oxygen meters take longer to stabilise','Combustible gas is heavier than oxygen','Oxygen readings are not required by regulation'],a:0,e:'Catalytic combustible-gas sensors require oxygen to function, so in an oxygen-deficient atmosphere the flammable reading cannot be trusted. Hence the order: oxygen, then flammable, then toxic.'},
{id:'e90',d:'SSA',lvl:2,t:'sc',q:'A confined space meter reads 24.2% oxygen. The correct response is:',o:['Do not enter — the atmosphere is oxygen enriched and a severe fire hazard','Enter normally, since a higher oxygen level is safer to breathe','Enter wearing hearing protection and a full-body harness','Disregard the reading, as only low oxygen presents a hazard'],a:0,e:'Above 23.5% is oxygen enriched, which dramatically increases fire and explosion risk. Find the source, often a leaking oxygen or air line, and ventilate before entry.'},
{id:'e91',d:'SSA',lvl:1,t:'mc',q:'In the hierarchy of controls, PPE ranks:',o:['Last','First','Second','It is not part of the hierarchy'],a:0,e:'Elimination → Substitution → Engineering → Administrative → PPE. PPE protects only the wearer and only if used correctly.'},
{id:'e92',d:'SSA',lvl:1,t:'mc',q:'WHMIS 2015 requires all of the following EXCEPT:',o:['Annual replacement of all chemical containers','Supplier and workplace labels','Safety Data Sheets','Worker education and training'],a:0,e:'The three pillars are labels, SDSs and training. There is no requirement to replace containers annually.'},
{id:'e93',d:'SSA',lvl:1,t:'mc',q:'When diluting concentrated acid, you should always:',o:['Add acid to water','Add water to acid','Add both simultaneously','Heat the water first'],a:0,e:'Always add acid TO water. The reaction is violently exothermic; the reverse can boil and spatter acid.'},
{id:'e94',d:'SSA',lvl:2,t:'sc',q:'Working in a wet well, you notice the rotten-egg odour has vanished. You should:',o:['Evacuate immediately','Continue working as the hazard has cleared','Remove your respirator to check','Increase the pump rate and continue'],a:0,e:'H₂S paralyses the sense of smell at dangerous concentrations. Losing the odour signals MORE danger, not less.'},
{id:'e95',d:'SSA',lvl:2,t:'sc',q:'A coworker collapses inside a digester. The correct action is:',o:['Do not enter; summon rescue and use retrieval equipment from outside','Enter immediately to help','Enter with another worker for safety','Wait ten minutes to see if they recover'],a:0,e:'The majority of confined space fatalities are would-be rescuers. Never enter without training and proper equipment.'},
{id:'e96',d:'SSA',lvl:2,t:'mc',q:'During lockout/tagout, a personal lock may be removed by:',o:['Only the worker who applied it','Any supervisor on shift','Any certified operator','The maintenance manager'],a:0,e:'Each worker applies and removes their own lock. This guarantees no one re-energises equipment someone else is still working on.'},
{id:'e97',d:'SSA',lvl:2,t:'mc',q:'Two steps commonly omitted from lockout/tagout are:',o:['Releasing stored energy and verifying zero energy','Filing a permit and notifying the supplier','Testing the atmosphere and posting a guard','Calibrating instruments and logging amps'],a:0,e:'Stored energy — pressure, springs, gravity, capacitors, heat — must be released, and zero energy verified by attempting to start.'},
{id:'e98',d:'SSA',lvl:2,t:'sc',q:'A chemical splash reaches an operator\'s eyes. The correct first aid is:',o:['Flush at the eyewash for at least 15 minutes and seek medical attention','Neutralise with a weak opposing chemical','Apply ointment and continue working','Rinse briefly and return to work'],a:0,e:'Flush for at least 15 minutes holding the eyelids open, then get medical attention. Never attempt chemical neutralisation on tissue.'},
{id:'e99',d:'SSA',lvl:2,t:'mc',q:'Hydrogen sulphide gas relative to air is:',o:['Heavier, so it collects in low points','Lighter, so it collects at the top','The same density as air','Only present above 40 °C'],a:0,e:'H₂S is heavier than air and pools in low areas — wet wells, sumps and manholes. Methane, by contrast, is lighter and collects high.'},
{id:'e100',d:'SSA',lvl:3,t:'sc',q:'You discover a permit limit exceedance in yesterday\'s results. The correct action is:',o:['Verify, correct the cause, document, and report within the required timeframe','Re-sample until a passing result is obtained and report that one','Wait for the monthly report to include it','Adjust the recorded value to fall within the limit'],a:0,e:'Verify, correct, document and report promptly. Selective re-sampling or altering records is falsification — the most serious operator offence.'},
{id:'e101',d:'SSA',lvl:3,t:'mc',q:'Which federal regulation sets national baseline effluent standards for Canadian wastewater systems?',o:['The Wastewater Systems Effluent Regulations (WSER)','The Municipal Wastewater Regulation','The Environmental Management Act','The Drinking Water Protection Regulation'],a:0,e:'WSER sits under the Fisheries Act and sets national baseline standards. The MWR and EMA are BC provincial instruments.'},
{id:'e102',d:'SSA',lvl:3,t:'mc',q:'EOCP certification is maintained by:',o:['Accumulating Continuing Education Units (CEUs)','Rewriting the exam every year','Working a set number of overtime hours','Holding a professional engineering designation'],a:0,e:'CEUs are required to renew EOCP certification. Track them as you earn them.'},
{id:'e103',d:'SSA',lvl:3,t:'sc',q:'You are asked to sign off on lab data you did not collect and believe may be inaccurate. You should:',o:['Decline to sign and escalate your concern in writing','Sign it since a supervisor requested it','Sign it but add a verbal comment','Alter the data to what you believe is correct'],a:0,e:'Never certify data you cannot verify. Escalate in writing. Falsifying or misrepresenting records is a serious regulatory and professional offence.'},
{id:'e104',d:'SSA',lvl:3,t:'sc',q:'A plant is upgraded and expanded, adding new treatment processes. Which is the most likely certification consequence?',o:['The facility classification may rise, requiring a higher operator certification level','Certification requirements never change after commissioning','All operators must immediately rewrite their exams','The plant becomes exempt from classification'],a:0,e:'Facility classification is based on size and complexity, so an upgrade can raise the class and therefore the certification level required of the operator in responsible charge. Confirm the new classification and staffing requirement.'},
{id:'e105',d:'SSA',lvl:3,t:'sc',q:'A chlorine gas leak is detected at the chlorine building. The correct immediate response is:',o:['Evacuate upwind and uphill and activate the emergency plan','Spray water on the leak to absorb the gas','Enter with a dust mask to close the valve','Open all doors and continue normal operations'],a:0,e:'Evacuate upwind and uphill. Only trained responders with SCBA may enter. Never apply water to a chlorine leak — it forms corrosive acid and worsens the release.'},
{id:'e106',d:'SSA',lvl:2,t:'mc',q:'An unlabelled container of unknown chemical is found in the plant. You should:',o:['Not use it, isolate it, and label it properly once identified','Use it if it looks familiar','Pour it into the nearest drain','Store it with the other chemicals unlabelled'],a:0,e:'WHMIS requires every container be labelled. An unidentified chemical must be treated as hazardous and isolated until identified.'},
{id:'e107',d:'SSA',lvl:1,t:'mc',q:'Operating logs and lab records are:',o:['A legal requirement and evidence of compliance','Optional internal notes','Needed only when SCADA fails','Required only during regulatory inspections'],a:0,e:'Records are legally required and constitute the plant\'s proof of proper operation.'},
{id:'e108',d:'SSA',lvl:1,t:'mc',q:'Chlorine must never be mixed with:',o:['Acid or ammonia','Water','Sodium hydroxide in a separate tank','Air'],a:0,e:'Chlorine plus acid releases chlorine gas; chlorine plus ammonia forms chloramine vapours. Both are life-threatening.'},
{id:'e109',d:'TPE',lvl:1,t:'mc',q:'Flow equalization is used to:',o:['Even out flow and load peaks reaching downstream processes','Remove grit before primary treatment','Disinfect the plant effluent','Thicken waste activated sludge'],a:0,e:'Equalization stores wastewater and releases it at a controlled rate, damping both hydraulic and organic peaks so downstream units see a steadier load.'},
{id:'e110',d:'TPE',lvl:2,t:'sc',q:'An equalization basin is producing strong odours and solids have accumulated on the floor. The most likely cause is:',o:['Inadequate mixing or aeration','The basin is drawn down too far each night','Influent flow is too low','Excessive chlorine in the influent'],a:0,e:'Equalization basins must be mixed and usually aerated. Without mixing, solids settle out and the contents turn septic.'},
{id:'e111',d:'TPE',lvl:2,t:'mc',q:'Which statement about grinders and comminutors is correct?',o:['They shred solids and leave them in the flow','They remove solids for landfill disposal','They remove only inorganic grit','They biologically degrade solids'],a:0,e:'Grinders and comminutors macerate solids in place. Only screens remove material from the wastewater. Shredded rags can re-knit into ropes that bind downstream pumps.'},
{id:'e112',d:'TPE',lvl:3,t:'sc',q:'A plant with no equalization sees its secondary clarifier lose solids every afternoon at peak flow, but perform well overnight. The most likely cause is:',o:['Hydraulic overload at peak flow raising the surface overflow rate','Sludge bulking that occurs only in daylight','A failed disinfection system','Grit accumulation in the aeration basin'],a:0,e:'A clarifier failing only at peak flow is a hydraulic problem — SOR rises above what the settling solids can tolerate. Flow equalization, or bringing another clarifier online, addresses it.'},
{id:'e113',d:'TPE',lvl:2,t:'calc',q:'US UNITS: A plant treats 1.5 MGD with an influent TSS of 240 mg/L. What is the TSS load in lbs/day?',o:['3,002 lbs/day','360 lbs/day','1,501 lbs/day','30,024 lbs/day'],a:0,e:'lbs/day = mg/L x MGD x 8.34 = 240 x 1.5 x 8.34 = 3,002 lbs/day.'},
{id:'e114',d:'TPE',lvl:3,t:'calc',q:'US UNITS: A circular clarifier 60 ft in diameter treats 0.9 MGD. What is the surface overflow rate in gpd/ft²?',o:['318 gpd/ft²','80 gpd/ft²','15,000 gpd/ft²','159 gpd/ft²'],a:0,e:'r = 30 ft. Area = pi x 900 = 2,827 ft². SOR = 900,000 ÷ 2,827 = 318 gpd/ft². Halve the diameter first.'},
{id:'e115',d:'EQP',lvl:2,t:'sc',q:'A plant has replaced its comminutor with a fine screen. The most likely reason is:',o:['Shredded rags were re-knitting and binding downstream pumps','Fine screens require no maintenance','Comminutors remove too much organic load','Fine screens eliminate the need for grit removal'],a:0,e:'Comminution leaves the shredded material in the flow, and rag fibres readily re-form into ropes that wrap pump impellers. Fine screens remove the material instead.'},
{id:'e116',d:'LAB',lvl:1,t:'mc',q:'Which calculating aid may you use on the EOCP certification exam?',o:['A basic four-function calculator, with the ABC Formula/Conversion Table provided','Your own programmable calculator loaded with wastewater formulas','Any reference book or set of personal notes you bring with you','A calculator application on your phone or other personal device'],a:0,e:'The exam is closed book. Personal reference sources and programmable calculators are not permitted. The ABC Formula/Conversion Table is provided and exam math is solvable with a basic four-function calculator.'},
{id:'e117',d:'TPE',lvl:2,t:'mc',q:'A key operating advantage of UV disinfection over chlorination is that UV:',o:['Leaves no toxic residual requiring dechlorination','Provides a lasting residual in the receiving water','Also removes suspended solids','Works better as turbidity increases'],a:0,e:'UV leaves no chemical residual, so no dechlorination step is needed and there are no disinfection by-products. It provides no lasting residual, and its performance falls as turbidity rises.'},
{id:'e118',d:'TPE',lvl:3,t:'sc',q:'A UV system meets its limits in summer but fails each spring during snowmelt, with lamps well within rated hours. The most likely cause is:',o:['Reduced UV transmittance from higher turbidity and colour in the water','Lamp output declining only during the spring months of the year','Excessive dechlorination chemical being fed upstream of the reactor','Colder water temperatures killing more organisms than in summer'],a:0,e:'UV dose depends on the light actually reaching the organisms. Snowmelt raises turbidity and colour, lowering UV transmittance so less energy penetrates. Check UVT and consider upstream solids removal.'},
{id:'e119',d:'TPE',lvl:2,t:'mc',q:'Dechlorination is required before discharge because chlorine residual is:',o:['Toxic to fish and aquatic life','Corrosive to the outfall pipe only','Required to be zero for pH reasons','Unstable and forms grit'],a:0,e:'Chlorine residual is toxic to aquatic organisms. Sulphur dioxide, sodium bisulphite, sodium metabisulphite or sodium thiosulphate are used to remove it.'},
{id:'e120',d:'TPE',lvl:3,t:'sc',q:'Effluent chlorine residual is zero after dechlorination, but effluent dissolved oxygen has dropped sharply. The most likely cause is:',o:['Dechlorination chemical overfeed consuming dissolved oxygen','Complete failure of the upstream chlorine feed system','UV disinfection lamps left running alongside chlorination','Excessive alkalinity carried through from the aeration basin'],a:0,e:'Sulphur-based dechlorination chemicals will consume dissolved oxygen if overfed. Match the dose to the measured residual and monitor effluent DO.'},
{id:'e121',d:'EQP',lvl:2,t:'sc',q:'Aeration basin DO has fallen plant-wide and blower discharge pressure has risen over several months. The most likely cause is:',o:['Diffuser fouling increasing back pressure','A sudden drop in influent BOD','Excessive wasting of sludge','Oversized blower motors'],a:0,e:'Fouled diffusers raise the pressure the blower must overcome and reduce delivered air. Clean or acid-wash the diffusers; check the blower inlet filter first as the cheaper cause.'},
{id:'e122',d:'EQP',lvl:1,t:'mc',q:'A blower inlet filter that is plugged will:',o:['Starve the blower of air and raise energy use','Improve oxygen transfer efficiency','Have no effect on blower performance','Increase the delivered air flow'],a:0,e:'A restricted inlet reduces the air the blower can draw, cutting delivered air and wasting energy. Inlet filters are a basic, frequently examined PM item.'},
{id:'e123',d:'SSA',lvl:2,t:'sc',q:'A chemical spill occurs in the plant. The correct first priority is:',o:['Protect yourself, then isolate the area and consult the SDS','Immediately hose the spill to the nearest drain','Neutralise it with the opposite chemical','Continue operations and clean up at shift end'],a:0,e:'Personal safety first, then isolate and contain. Consult the SDS for the correct handling, absorbent and PPE, and follow the emergency plan. Never flush a chemical spill to drain.'},
{id:'e124',d:'SSA',lvl:2,t:'mc',q:'Under the federal Fisheries Act, the regulation that sets national baseline effluent standards for Canadian wastewater systems is the:',o:['Wastewater Systems Effluent Regulations (WSER)','Municipal Wastewater Regulation','Environmental Management Act','Canada Water Act'],a:0,e:'WSER sits under the Fisheries Act and sets national baseline standards. The Municipal Wastewater Regulation and Environmental Management Act are BC provincial instruments.'},
{id:'e125',d:'SSA',lvl:3,t:'mc',q:'In British Columbia, the legislation that enables the Municipal Wastewater Regulation is the:',o:['Environmental Management Act','Fisheries Act','Drinking Water Protection Act','Canada Water Act'],a:0,e:'The Environmental Management Act is BC\'s principal environmental protection legislation, and the Municipal Wastewater Regulation is made under it.'},
{id:'e126',d:'EQP',lvl:1,t:'sc',q:'Standby pumps, motors and generators should be started and run regularly because:',o:['Idle equipment seizes or fails to start when it is actually needed','It uses up old fuel before it expires','Regulations require all equipment to run continuously','It increases the plant total running hours'],a:0,e:'Standby equipment is only useful if it starts. Idle units seize, bearings corrode and batteries flatten. Scheduled exercising under load is a routine operator duty.'},
{id:'e127',d:'EQP',lvl:2,t:'sc',q:'An operator notes the chemical storage tank will be empty within two days. The correct response is:',o:['Arrange resupply now and record the delivery in the plant log','Halve the chemical dose so the stock lasts twice as long','Take the treatment process offline until stock arrives','Wait until the tank is completely empty before ordering'],a:0,e:'Maintaining chemical inventory is a routine duty. Cutting the dose to stretch stock deliberately under-treats the water and risks a permit exceedance.'},
{id:'e128',d:'TPE',lvl:1,t:'mc',q:'Healthy activated sludge is normally described as:',o:['Chocolate-brown with an earthy or musty odour','Black with a rotten-egg odour','Grey with a strong chlorine odour','Colourless and completely odourless'],a:0,e:'Chocolate-brown with a light earthy smell indicates a healthy aerobic population. Black with a hydrogen sulphide smell indicates septic, oxygen-starved conditions.'},
{id:'e129',d:'TPE',lvl:2,t:'sc',q:'Sludge is allowed to accumulate in a settling basin well beyond its normal removal schedule. The most likely consequence is:',o:['Reduced effective volume and septic conditions degrading effluent quality','Improved settling because the blanket is deeper','Lower chemical consumption throughout the plant','An increase in the plant hydraulic capacity'],a:0,e:'Accumulated sludge steals design volume, shortens detention time and goes septic, releasing odours and dissolved organics back into the water.'},
{id:'e130',d:'SSA',lvl:1,t:'sc',q:'Which is a routine DAILY duty for a plant operator?',o:['Observing each process and recording readings in the operating log','Rebuilding the main influent pump','Recalculating the facility classification','Renewing the facility discharge permit'],a:0,e:'Daily duties are observation, monitoring and record keeping. Pump rebuilds are scheduled maintenance; classification and permit renewal are infrequent administrative events.'},
{id:'e131',d:'LAB',lvl:1,t:'sc',q:'Mixed liquor is settled in a graduated cylinder and read after 30 minutes. The purpose is to assess:',o:['Sludge settleability, which with MLSS gives the SVI','Chlorine demand in the effluent','Influent alkalinity','Grit loading at the headworks'],a:0,e:'This is the settleability (settleometer) test — the fastest daily indicator of sludge condition. Combined with MLSS it yields the Sludge Volume Index.'}
];

/* app.js — UI, navigation, state and grading for the EOCP WWT Level I study app.
 *
 * All study content lives in the data files (curriculum.js, questions.js, flashcards.js,
 * math.js, exams.js, references.js). This file is UI and logic only.
 *
 * State is persisted to localStorage under one key so it survives reloads and works offline.
 */

'use strict';

/* ============================== STATE ============================== */
const KEY_BASE = 'eocp_study_v2';
let KEY = KEY_BASE + '_OIT';   // set properly in load()

const BLANK = {
  lessonsRead: {},     // lessonId -> true
  practice:    {},     // questionId -> {correct:bool, ts}
  tests:       {},     // moduleId -> {score, total, pct, ts, wrong:[qid]}
  mocks:       {},     // examId -> {score, total, pct, ts, byDuty:{}, wrong:[]}
  math:        {},     // topicId+level -> {correct:bool, ts}
  cards:       {},     // cardId -> {box:1-5, due: timestamp}
  weak:        {},     // topic key -> count of misses
  theme:       null,
  plan:        null,
  track:       'OIT'   // 'OIT' or 'WWT1' — which exam you are studying for
};

let S = load();

function activeTrack(){
  try { return localStorage.getItem(KEY_BASE + '_track') === 'WWT1' ? 'WWT1' : 'OIT'; }
  catch(e){ return 'OIT'; }
}
function load(){
  KEY = KEY_BASE + '_' + activeTrack();
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw){ const b = JSON.parse(JSON.stringify(BLANK)); b.track = activeTrack(); return b; }
    const st = Object.assign(JSON.parse(JSON.stringify(BLANK)), JSON.parse(raw));
    st.track = activeTrack();
    return st;
  } catch(e){
    console.warn('Could not read saved progress, starting fresh.', e);
    const b = JSON.parse(JSON.stringify(BLANK)); b.track = activeTrack(); return b;
  }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ console.warn('Could not save progress.', e); }
}

/* ============================== HELPERS ============================== */
const $  = (sel, root) => (root||document).querySelector(sel);
const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
};
const pct = (a,b) => b ? Math.round((a/b)*100) : 0;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now = () => Date.now();
const DAY = 86400000;

/* Deterministic shuffle so exams and option orders are stable between visits.
 * Uses Math.imul for the LCG step: plain `s * 1103515245` exceeds JavaScript's
 * 2^53 exact-integer range for large seeds, so the low bits — the ones the
 * modulo actually uses — turn to garbage and every seed collapses to the same
 * permutation. Math.imul keeps the arithmetic exact 32-bit. */
function seededShuffle(arr, seed){
  const a = arr.slice();
  let s = (seed | 0) || 1;
  for (let i = a.length - 1; i > 0; i--){
    s = (Math.imul(s, 1103515245) + 12345) & 0x7fffffff;
    const j = s % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---- Option-order presentation ----------------------------------------
 * Questions are authored with the correct answer first (a:0) because that is
 * far easier to write and review. Presenting them that way would make the app
 * trivially gameable and nothing like a real exam, so every question's options
 * are shuffled deterministically from its id: the same question always shows
 * the same order (so a review screen matches what you answered), but the
 * correct answer lands in a different position each time.
 * This also means any question YOU add with a:0 is handled automatically. */
const PRES = {};
function hashId(str){
  let h = 2166136261;
  for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return Math.abs(h);
}
function present(q){
  if (PRES[q.id]) return PRES[q.id];
  const order = seededShuffle(q.o.map((_,i) => i), hashId(q.id));
  const p = { o: order.map(i => q.o[i]), a: order.indexOf(q.a) };
  PRES[q.id] = p;
  return p;
}

/* ---- Exam track -------------------------------------------------------
 * The app carries two separate exams:
 *   OIT  — Operator-in-Training. ONE exam covering all four streams
 *          (water treatment, water distribution, wastewater collection,
 *          wastewater treatment). Broad and shallow.
 *   WWT1 — Wastewater Treatment Level I. Wastewater treatment only, far deeper.
 * They are different exams with different content, so every content accessor
 * below filters by the active track. Progress is stored per track. */
function track(){ return S.track === 'WWT1' ? 'WWT1' : 'OIT'; }
function isOIT(){ return track() === 'OIT'; }
function modules(){ return isOIT() ? OIT_MODULES : CURRICULUM; }
function lessons(){
  return modules().flatMap(m => m.lessons.map(l => ({...l, moduleId:m.id, moduleTitle:m.title, moduleN:m.n, duty:m.duty})));
}
function duties(){ return isOIT() ? OIT_DUTIES : DUTIES; }
function questions(){ return isOIT() ? OIT_QUESTIONS : QUESTIONS; }
function cards(){
  const mids = new Set(modules().map(m => m.id));
  const out = [];
  lessons().forEach(l => (l.terms||[]).forEach((t,i) => out.push({
    id:`${l.id}-t${i}`, m:l.moduleId, lesson:l.id, tag:'definition',
    q:`Define: ${t.t}`, a:t.d })));
  (isOIT() ? OIT_CARDS : FLASHCARDS.filter(c => !c.lesson)).forEach((c,i) => {
    if (isOIT()) out.push({ id:`ox${i}`, m:c.m, lesson:null, tag:c.tag, q:c.q, a:c.a });
    else if (mids.has(c.m)) out.push(c);
  });
  return out;
}
function cardsFor(mid){ return cards().filter(c => c.m === mid); }
function glossary(){
  const seen = new Map();
  lessons().forEach(l => (l.terms||[]).forEach(t => {
    if (!seen.has(t.t.toLowerCase())) seen.set(t.t.toLowerCase(), {...t, from:l.moduleTitle});
  }));
  return [...seen.values()].sort((a,b) => a.t.localeCompare(b.t));
}

function bandClass(p){ return p >= 80 ? 'good' : p >= 60 ? 'warn' : 'bad'; }
function bandLabel(p){ return p >= 85 ? 'Exam Ready' : p >= 70 ? 'Nearly Ready' : p >= 50 ? 'Developing' : 'Not Ready'; }

/* ============================== DERIVED METRICS ============================== */
function courseProgress(){
  const L = lessons();
  const total = L.length;
  const read = L.filter(l => S.lessonsRead[l.id]).length;
  return { read, total, pct: pct(read, total) };
}
function testAverage(){
  const v = Object.values(S.tests);
  if (!v.length) return null;
  return Math.round(v.reduce((s,t) => s + t.pct, 0) / v.length);
}
function mathAverage(){
  const v = Object.values(S.math);
  if (!v.length) return null;
  return pct(v.filter(x => x.correct).length, v.length);
}
function mockAverage(){
  const v = Object.values(S.mocks);
  if (!v.length) return null;
  return Math.round(v.reduce((s,m) => s + m.pct, 0) / v.length);
}
function cardsDue(){
  const t = now();
  return cards().filter(c => {
    const st = S.cards[c.id];
    return !st || st.due <= t;
  }).length;
}
/* Weak areas: modules where the operator has demonstrably struggled */
function weakAreas(){
  const out = [];
  modules().forEach(m => {
    const t = S.tests[m.id];
    const qs = questions().filter(q => q.m === m.id);
    const answered = qs.filter(q => S.practice[q.id]);
    const pracPct = answered.length ? pct(answered.filter(q => S.practice[q.id].correct).length, answered.length) : null;
    let score = null;
    if (t && pracPct != null) score = Math.round((t.pct + pracPct) / 2);
    else if (t) score = t.pct;
    else if (pracPct != null) score = pracPct;
    if (score != null && score < 70) out.push({ m, score });
  });
  return out.sort((a,b) => a.score - b.score);
}
function strongAreas(){
  const out = [];
  modules().forEach(m => {
    const t = S.tests[m.id];
    if (t && t.pct >= 80) out.push({ m, score: t.pct });
  });
  return out.sort((a,b) => b.score - a.score);
}
function moduleStatus(m){
  const lessonCount = m.lessons.length;
  const read = m.lessons.filter(l => S.lessonsRead[l.id]).length;
  const t = S.tests[m.id];
  if (t && t.pct >= 85 && read === lessonCount) return 'Exam Ready';
  if (t && t.pct >= 70) return 'Nearly Ready';
  if (t) return 'Developing';
  if (read > 0) return 'Developing';
  return 'Not Ready';
}

/* Overall readiness — deliberately strict. Every pillar must hold up. */
function readiness(){
  const cp = courseProgress().pct;
  const ta = testAverage();
  const ma = mathAverage();
  const mk = mockAverage();
  const tested = Object.keys(S.tests).length;
  const mocksTaken = Object.keys(S.mocks).length;
  const weak = weakAreas().length;

  const pillars = [
    {k:'Course lessons read', v:cp, need:100, ok:cp >= 100},
    {k:'Section tests completed', v:tested, need:modules().length, ok:tested >= modules().length, raw:true},
    {k:'Section test average', v:ta==null?0:ta, need:80, ok:ta != null && ta >= 80},
    {k:'Mathematics average', v:ma==null?0:ma, need:80, ok:ma != null && ma >= 80},
    {k:'Mock exams completed', v:mocksTaken, need:EXAM_DEFS.length, ok:mocksTaken >= EXAM_DEFS.length, raw:true},
    {k:'Mock exam average', v:mk==null?0:mk, need:80, ok:mk != null && mk >= 80},
    {k:'No weak areas remaining', v:weak, need:0, ok:weak === 0, raw:true, invert:true}
  ];
  const okCount = pillars.filter(p => p.ok).length;
  const overall = pct(okCount, pillars.length);
  let verdict;
  if (okCount === pillars.length) verdict = 'Exam Ready';
  else if (overall >= 70) verdict = 'Nearly Ready';
  else if (overall >= 35) verdict = 'Developing';
  else verdict = 'Not Ready';
  return { pillars, okCount, overall, verdict };
}

/* Reusable question card. immediate = reveal answer as soon as one is chosen. */
function questionCard(q, n, immediate, state){
  const card = el('div','q');
  const P = present(q);
  const typeLabel = q.t === 'calc' ? 'Calculation' : q.t === 'sc' ? 'Scenario' : 'Multiple choice';
  card.appendChild(el('div','q-n', `Question ${n} · ${typeLabel}`));
  card.appendChild(el('div','q-t', q.q));
  const opts = [];
  P.o.forEach((o,i) => {
    const b = el('button','opt', `<span class="k">${'ABCD'[i]}</span><span>${o}</span>`);
    b.onclick = () => {
      if (immediate){
        if (card.dataset.answered) return;
        card.dataset.answered = '1';
        opts.forEach((x,xi) => {
          x.disabled = true;
          if (xi === P.a) x.classList.add('correct');
          else if (xi === i) x.classList.add('wrong');
        });
        const ok = i === P.a;
        S.practice[q.id] = { correct: ok, ts: now() };
        save();
        const ex = el('div','expl', `<b>${ok ? 'Correct.' : 'Not quite — the answer is ' + 'ABCD'[P.a] + '.'}</b> ${q.e}`);
        card.appendChild(ex);
      } else {
        opts.forEach(x => x.classList.remove('sel'));
        b.classList.add('sel');
        if (state) state[q.id] = i;
      }
    };
    opts.push(b);
    card.appendChild(b);
  });
  return card;
}

function startCards(cards){
  if (!cards.length) return;
  fcState = { deck: seededShuffle(cards, cards.length + 7), i:0, flipped:false, done:0 };
  go('flashcards','run');
}

function renderCard(app){
  if (!fcState || fcState.i >= fcState.deck.length){
    const c = el('div','card center');
    c.appendChild(el('div','empty','<span class="big">✓</span>Deck complete'));
    c.appendChild(el('p','muted small',`You reviewed ${fcState ? fcState.done : 0} cards.`));
    const b = el('button','btn'); b.textContent = 'Back to flashcards';
    b.onclick = () => { fcState = null; go('flashcards'); };
    c.appendChild(b);
    app.appendChild(c);
    return;
  }
  const card = fcState.deck[fcState.i];
  crumb(app,'Flashcards',() => { fcState = null; go('flashcards'); });
  app.appendChild(el('p','muted small center',`Card ${fcState.i+1} of ${fcState.deck.length} · Box ${(S.cards[card.id]||{box:1}).box} · ${card.tag}`));

  const fc = el('div','fc');
  fc.innerHTML = fcState.flipped
    ? `<div class="side">Answer</div><div class="body ans">${card.a}</div>`
    : `<div class="side">Question</div><div class="body">${card.q}</div>`;
  fc.onclick = () => { fcState.flipped = !fcState.flipped; render(); };
  app.appendChild(fc);

  if (!fcState.flipped){
    const b = el('button','btn btn-block'); b.textContent = 'Show answer';
    b.onclick = () => { fcState.flipped = true; render(); };
    app.appendChild(b);
  } else {
    const row = el('div','row');
    const mk = (label, cls, right) => {
      const b = el('button','btn ' + cls);
      b.style.flex = '1'; b.textContent = label;
      b.onclick = () => {
        const cur = S.cards[card.id] || {box:1};
        const box = right ? Math.min(5, cur.box + 1) : 1;
        S.cards[card.id] = { box, due: now() + LEITNER_INTERVALS[box] * DAY };
        save();
        fcState.done++; fcState.i++; fcState.flipped = false;
        render();
      };
      return b;
    };
    row.appendChild(mk('Got it wrong','btn-quiet', false));
    row.appendChild(mk('Got it right','', true));
    app.appendChild(row);
  }
}

let mockState = null;

/* Assemble an exam weighted to the real duty distribution.
 *
 * Each duty's pool is shuffled with a FIXED seed, so every exam sees the same
 * ordering. `def.start` then selects a different WINDOW of that ordering per exam,
 * which is what keeps the five exams from repeating each other's questions.
 * (Reseeding the shuffle per exam does not do this — it reshuffles the same
 * members and produces heavy overlap.) */
function buildExam(def){
  const picked = [];
  const pool = MOCK_BANK.filter(q => def.levels.includes(q.lvl));
  Object.keys(DUTY_WEIGHT).forEach(d => {
    const set = seededShuffle(pool.filter(q => q.d === d), d.charCodeAt(0) * 7 + 13);
    if (!set.length) return;
    const want = Math.min(Math.round(def.n * DUTY_WEIGHT[d]), set.length);
    const start = (def.start || 0) % set.length;
    for (let i = 0; i < want; i++) picked.push(set[(start + i) % set.length]);
  });
  /* de-duplicate, then top up from the wider pool if a duty pool ran short */
  const seen = new Set(); const out = [];
  picked.forEach(q => { if (!seen.has(q.id)){ seen.add(q.id); out.push(q); } });
  const extra = seededShuffle(pool.filter(q => !seen.has(q.id)), (def.start || 0) + 99);
  let k = 0;
  while (out.length < def.n && k < extra.length){ out.push(extra[k++]); }
  return seededShuffle(out.slice(0, def.n), (def.start || 0) + 42);
}

    const w = el('div','scroll-x'); const t = el('table','tbl'); const b = el('tbody');
    CONVERSIONS.filter(x => x.c === cat).forEach(x => {
      const tr = el('tr'); tr.innerHTML = `<td><strong>${x.a}</strong></td><td>${x.b}</td>`;
      b.appendChild(tr);
    });
    t.appendChild(b); w.appendChild(t); c.appendChild(w);
  });
  app.appendChild(c);

  const l = el('div','card');
  l.appendChild(el('h3',null,'Get the official sheet'));
  [
    {t:'ABC/EOCP Canadian Formula & Conversion Table — Wastewater', u:'https://eocp.ca/wp-content/uploads/2015/03/ABC-Formula-Sheet-WWTWWC.pdf'},
    {t:'Math for Operators — guide to using the ABC/EOCP formulas', u:'https://eocp.ca/wp-content/uploads/2023/06/2022-EOCP-Guide-to-the-EOCP-and-ABC-formulas-G.Faris_.pdf'},
    {t:'WPI Formula/Conversion Tables', u:'https://gowpi.org/services/abc-testing/formula-conversion-tables/'}
  ].forEach(x => {
    const a = el('a','item',`<span class="t">${x.t}</span><span class="s">${x.u}</span>`);
    a.href = x.u; a.target='_blank'; a.rel='noopener';
    l.appendChild(a);
  });
  app.appendChild(l);
}

/* ------------------------------ REFERENCES ------------------------------ */
function vRefs(app){
  app.appendChild(el('p','muted small','Only resources that genuinely help with EOCP Wastewater Treatment Level I. Nothing padded.'));
  REFERENCES.forEach(g => {
    const c = el('div','card');
    c.appendChild(el('div','spread',`<h3 style="margin:0">${g.tier}</h3><span class="pill ${g.tier==='ESSENTIAL'?'accent':''}">${g.items.length}</span>`));
    g.items.forEach(it => {
      const d = el('details');
      d.appendChild(el('summary',null,it.n));
      d.appendChild(el('div','small',
        `<div class="muted xs" style="margin-bottom:6px">${it.o} · ${it.y}</div>${it.w}`));
      const a = el('a','btn btn-sm'); a.href = it.u; a.target='_blank'; a.rel='noopener';
      a.textContent = 'Open resource';
      a.style.marginTop = '9px';
      d.appendChild(a);
      c.appendChild(d);
    });
    app.appendChild(c);
  });
}

/* ------------------------------ READINESS ------------------------------ */
function vReady(app){
  const r = readiness();
  const h = el('div','card');
  h.appendChild(el('h1',null,'Exam Readiness'));
  h.appendChild(el('div','center',
    `<div style="font-size:2.6rem;font-weight:800;color:var(--accent)">${r.overall}%</div>
     <span class="pill ${bandClass(r.overall)}">${r.verdict}</span>`));
  const bar = el('div','bar ' + bandClass(r.overall)); const i = el('i'); i.style.width = r.overall + '%'; bar.appendChild(i);
  h.appendChild(bar);
  h.appendChild(el('div','callout field','<span class="lbl">Internal study benchmark — NOT an EOCP passing requirement</span>' +
    'The 80% thresholds below are <strong>this app\'s own study benchmark</strong>, set deliberately above the real standard to leave you a margin. ' +
    'EOCP\'s actual passing standard is <strong>70% scaled score units</strong> (OFFICIAL). ' +
    'Scoring "Exam Ready" here does not guarantee a pass, and is not an EOCP assessment of any kind.'));
  h.appendChild(el('p','muted small center','Readiness uses seven separate metrics, not one test score. Every check must pass.'));
  app.appendChild(h);

  const c = el('div','card');
  c.appendChild(el('h3',null,'Readiness checks'));
  r.pillars.forEach(p => {
    const row = el('div','spread small');
    row.style.padding = '9px 0';
    row.style.borderBottom = '1px solid var(--line)';
    const val = p.raw ? (p.invert ? `${p.v} remaining` : `${p.v} / ${p.need}`) : `${p.v}% (need ${p.need}%)`;
    row.innerHTML = `<span>${p.k}<br><span class="muted xs">${val}</span></span>
      <span class="pill ${p.ok ? 'good' : 'bad'}">${p.ok ? 'Pass' : 'Not yet'}</span>`;
    c.appendChild(row);
  });
  app.appendChild(c);

  const m = el('div','card');
  m.appendChild(el('h3',null,'Module checklist'));
  m.appendChild(el('p','muted small','Not Ready → Developing → Nearly Ready → Exam Ready'));
  modules().forEach(mod => {
    const st = moduleStatus(mod);
    const cls = st === 'Exam Ready' ? 'good' : st === 'Nearly Ready' ? 'good' : st === 'Not Ready' ? '' : 'warn';
    const row = el('button','item');
    row.innerHTML = `<span class="t">Module ${mod.n} — ${mod.title}</span>
      <span class="badge-line"><span class="pill ${cls}">${st}</span>
      <span class="pill">${duties()[mod.duty].name}</span></span>`;
    row.onclick = () => go('course', mod.id);
    m.appendChild(row);
  });
  app.appendChild(m);
}

/* ------------------------------ STUDY PLANS ------------------------------ */
function vPlans(app){
  if (route.a){
    const p = STUDY_PLANS.find(x => x.id === route.a);
    if (!p) return go('plans');
    crumb(app,'Study plans',() => go('plans'));
    const h = el('div','card');
    h.appendChild(el('h1',null,p.name));
    h.appendChild(el('p','muted small',`${p.pace} · ${p.hrs}`));
    h.appendChild(el('p','small',p.note));
    app.appendChild(h);
    p.weeks.forEach(w => {
      const d = el('details');
      d.appendChild(el('summary',null,`Week ${w.w} — ${w.focus}`));
      const ul = el('ul','small');
      w.tasks.forEach(t => ul.appendChild(el('li',null,t)));
      d.appendChild(ul);
      app.appendChild(d);
    });
    return;
  }
  app.appendChild(el('p','muted small','Pick the plan that matches how much time you actually have. Be honest about it — an abandoned 4-week plan is worse than a finished 12-week one.'));
  STUDY_PLANS.forEach(p => {
    const b = el('button','item');
    b.innerHTML = `<span class="t">${p.name}</span><span class="s">${p.pace} · ${p.hrs}</span>
      <span class="badge-line"><span class="pill">${p.weeks.length} weeks</span></span>`;
    b.onclick = () => go('plans', p.id);
    app.appendChild(b);
  });
}

/* ============================== CHROME ============================== */
function buildNav(){
  const ul = $('#navList');
  VIEWS.forEach(v => {
    const li = el('li');
    const b = el('button','navlink', `<span class="ico">${v.ico}</span>${v.label}`);
    b.dataset.v = v.id;
    b.onclick = () => go(v.id);
    li.appendChild(b); ul.appendChild(li);
  });
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => go(t.dataset.goto);
  });
}
function openDrawer(){
  $('#drawer').classList.add('open');
  $('#scrim').hidden = false;
  $('#menuBtn').setAttribute('aria-expanded','true');
}
function closeDrawer(){
  $('#drawer').classList.remove('open');
  $('#scrim').hidden = true;
  $('#menuBtn').setAttribute('aria-expanded','false');
}
function updateNav(){ /* placeholder for future live badges */ }

function switchTrack(t){
  try { localStorage.setItem(KEY_BASE + '_track', t); } catch(e){}
  S = load();
  testState = mockState = fcState = null;
  for (const k in PRES) delete PRES[k];
  updateChrome();
  go('dashboard');
}
function updateChrome(){
  const oit = isOIT();
  const btn = document.getElementById('trackBtn');
  if (btn) btn.textContent = oit ? 'OIT' : 'WWT 1';
  const sub = document.querySelector('.topbar-title small');
  if (sub) sub.textContent = oit ? 'EOCP Operator-in-Training' : 'EOCP Wastewater Treatment I';
  const brand = document.querySelector('.brand');
  if (brand) brand.textContent = oit ? 'OIT' : 'WWT I';
  // math and mock exams are Level I material only
  document.querySelectorAll('#navList button').forEach(b => {
    const wwtOnly = ['math','mock','formulas'].includes(b.dataset.v);
    b.style.display = (oit && wwtOnly) ? 'none' : '';
  });
  document.querySelectorAll('.tab').forEach(b => {
    const wwtOnly = ['math','mock'].includes(b.dataset.goto);
    b.style.display = (oit && wwtOnly) ? 'none' : '';
  });
}

function applyTheme(){
  if (S.theme) document.documentElement.setAttribute('data-theme', S.theme);
  else document.documentElement.removeAttribute('data-theme');
}

/* ============================== BOOT ============================== */
function boot(){
  buildNav();
  applyTheme();
  updateChrome();
  $('#menuBtn').onclick = () => {
    $('#drawer').classList.contains('open') ? closeDrawer() : openDrawer();
  };
  $('#scrim').onclick = closeDrawer;
  $('#trackBtn').onclick = () => {
    const next = isOIT() ? 'WWT1' : 'OIT';
    const label = next === 'OIT' ? 'Operator-in-Training (OIT)' : 'Wastewater Treatment Level I';
    if (confirm(`Switch to ${label}?\n\nThese are two different exams with different content. Your progress on each is saved separately, so nothing is lost.`)){
      switchTrack(next);
    }
  };
  $('#themeBtn').onclick = () => {
    const cur = S.theme;
    S.theme = cur === 'dark' ? 'light' : cur === 'light' ? null : 'dark';
    save(); applyTheme();
  };
  $('#resetBtn').onclick = () => {
    if (confirm('Erase all progress — lessons read, test scores, flashcard boxes and math results? This cannot be undone.')){
      localStorage.removeItem(KEY);
      S = JSON.parse(JSON.stringify(BLANK));
      testState = mockState = fcState = null;
      applyTheme(); go('dashboard');
    }
  };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
  render();
}

document.addEventListener('DOMContentLoaded', boot);

</script>
</body>
</html>
